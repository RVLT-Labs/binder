name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The API's processing tests run the real PDF tools; the root test setup starts Postgres through
      # testcontainers, which the runner's Docker provides.
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils ocrmypdf qpdf tesseract-ocr tesseract-ocr-eng ghostscript
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  # Builds every image the production compose file builds, without pushing, and checks the compose
  # file resolves. gen-env.sh writes throwaway values; nothing here is deployed.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: deploy/scripts/gen-env.sh
      - name: Validate compose
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env config --quiet
      - uses: docker/setup-buildx-action@v3
      # Build the two big images through buildx with the GitHub Actions layer cache, loaded into the
      # local Docker so the next step can run the API image. Nothing is pushed.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          load: true
          push: false
          tags: binder-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.web
          load: true
          push: false
          tags: binder-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
      - name: The API image has the PDF tools
        run: docker run --rm --entrypoint ocrmypdf binder-api:ci --version
      # The two small images are built from the compose file, so a compose/Dockerfile mismatch fails here.
      - name: Build the postgres and powersync images
        run: docker compose -f deploy/docker-compose.yml --env-file deploy/.env build postgres powersync

  # Browser suites against the dev compose stack (Postgres and PowerSync). Slower, so not on pull requests.
  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            poppler-utils ocrmypdf qpdf tesseract-ocr tesseract-ocr-eng ghostscript
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The project name fixes the container names (binder-dev-postgres-1, binder-dev-powersync-1) that
      # apps/web/e2e/reconnect.spec.ts stops and starts.
      - name: Start the dev stack
        run: docker compose -p binder-dev -f deploy/docker-compose.dev.yml up -d --wait
      - run: pnpm --filter @binder/web exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm --filter @binder/web e2e
      # The cue size spec's screenshots and exported PDF, kept on success too (visual acceptance).
      # Before the offline run, which empties test-results when it starts.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cue-size-e2e
          path: apps/web/test-results/cueSize-*
          if-no-files-found: warn
      - name: Playwright offline
        run: pnpm --filter @binder/web e2e:offline
      - name: Stack logs on failure
        if: failure()
        run: docker compose -p binder-dev -f deploy/docker-compose.dev.yml logs --no-color --tail 200
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/web/test-results
          if-no-files-found: ignore
